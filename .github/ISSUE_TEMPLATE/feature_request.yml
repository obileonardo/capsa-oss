name: Feature request
description: Suggest a change to the MCP server, capsa or the file format.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Keep in mind that both tools stay read-only, offline and dependency-free.
    validations:
      required: true
